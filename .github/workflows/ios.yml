name: iOS

on:
  push:
    branches: [ "main" ]
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        run: xcodebuild test -scheme AWLDebugTool -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
      - name: Build example
        working-directory: ios/example
        run: xcodebuild build -project Example.xcodeproj -scheme Example -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
