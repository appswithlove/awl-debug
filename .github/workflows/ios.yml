name: iOS

# Manual only: macOS runners are expensive, run locally during development.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        run: xcodebuild test -scheme AWLDebugTool -destination 'platform=iOS Simulator,name=iPhone 16'
      - name: Build example
        working-directory: ios/example
        run: xcodebuild build -project Example.xcodeproj -scheme Example -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
