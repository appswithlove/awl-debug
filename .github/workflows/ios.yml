name: iOS

# Manual only: macOS runners are expensive, run locally during development.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        run: xcodebuild test -scheme AWLDebugTool -destination 'platform=iOS Simulator,name=iPhone 16'
      - name: Build sample
        working-directory: ios/sample
        run: xcodebuild build -project Sample.xcodeproj -scheme Sample -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
