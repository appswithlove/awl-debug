name: iOS

on:
  push:
    branches: [ "main" ]
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      # The runner's Xcode can be newer than its installed iOS runtimes, so pick an iPhone on the newest installed runtime.
      - name: Package tests
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key | capture("iOS-(?<v>.+)").v | split("-") | map(tonumber)) | last.value | map(select(.name | startswith("iPhone"))) | first.udid')
          xcodebuild test -scheme AWLDebugTool -destination "id=$udid"
      - name: Build example
        working-directory: ios/example
        run: xcodebuild build -project Example.xcodeproj -scheme Example -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
