name: Publish

on:
  push:
    branches: [ production ]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Extract version from gradle.properties
        id: get_version
        run: echo "version=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Fail if version already released
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.get_version.outputs.version }}" | grep -q .; then
            echo "::error::Version ${{ steps.get_version.outputs.version }} is already tagged - bump VERSION_NAME before publishing."
            exit 1
          fi

      - name: Verify published modules
        run: ./gradlew :lib-api:build :lib:build :lib-no-op:build

      - name: Publish to Maven Central Portal
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body: |
            Release ${{ steps.get_version.outputs.version }}

            Published to Maven Central:
            - `com.appswithlove.debug:debug:${{ steps.get_version.outputs.version }}`
            - `com.appswithlove.debug:debug-no-op:${{ steps.get_version.outputs.version }}`
            - `com.appswithlove.debug:debug-api:${{ steps.get_version.outputs.version }}`
