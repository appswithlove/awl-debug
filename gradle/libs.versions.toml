datastore = "1.2.1"
okhttp = "4.12.0"
timber = "5.0.1"
vico = "3.2.2"
coroutines = "1.10.2"
kotest = "5.9.1"
turbine = "1.2.1"
robolectric = "4.14.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
